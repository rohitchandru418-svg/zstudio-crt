services:
  - type: web
    name: zstudio-crt
    runtime: static
    staticPublishPath: ./crt-screen
    routes:
      - type: rewrite
        source: /_preview.html
        destination: /404.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /landing.js
        name: Cache-Control
        value: public, max-age=300
