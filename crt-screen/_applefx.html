<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AppleEfx — exact port of oryzo's "Powered by AI" glow</title>
<style>
  html,body{margin:0;height:100%;background:#050404;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;left:14px;bottom:14px;width:268px;padding:12px 14px;border-radius:10px;
    background:rgba(22,17,15,.78);border:1px solid rgba(255,140,0,.22);
    font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8d8178;
    display:grid;gap:7px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  #hud h1{margin:0 0 2px;font:500 10px/1.2 ui-monospace,monospace;letter-spacing:.22em;
    text-transform:uppercase;color:#c58a4e}
  label{display:grid;grid-template-columns:74px 1fr 40px;align-items:center;gap:8px}
  input[type=range]{width:100%;accent-color:#ff8c00;height:14px}
  output{color:#ffb066;text-align:right;font-variant-numeric:tabular-nums}
  .sw{display:flex;gap:5px;margin-top:1px}
  .sw i{width:26px;height:9px;border-radius:2px}
  button{font:inherit;color:#ffcf9c;background:rgba(255,140,0,.14);
    border:1px solid rgba(255,140,0,.34);border-radius:6px;padding:4px 8px;cursor:pointer}
  button:active{background:rgba(255,140,0,.28)}
  .row{display:flex;gap:6px;align-items:center}
  .cap{color:#635951;font-size:10px;line-height:1.35}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <h1>apple efx — exact port</h1>
  <label>amount <input id="amount" type="range" min="0" max="1" step="0.01" value="1"><output id="amountOut">1.00</output></label>
  <label>spin <input id="spin" type="range" min="0" max="3" step="0.05" value="1"><output id="spinOut">×1.00</output></label>
  <label>padding <input id="pad" type="range" min="0" max="80" step="1" value="50"><output id="padOut">50</output></label>
  <div class="row">
    <button id="pulse">fire pulse</button>
    <label style="grid-template-columns:auto 1fr;gap:4px"><input id="loop" type="checkbox" checked> loop</label>
  </div>
  <div class="sw" id="sw"></div>
  <div class="cap">#ff9cff · #ff9638 · #ffff22 · #54ffff, cubing ×2, edge SDF pow(3)+pow(5), 2 s ring from the scrollbar edge.</div>
</div>

<script>
(() => {
  const cvs = document.getElementById('c');
  const gl = cvs.getContext('webgl', { antialias: false, alpha: false, premultipliedAlpha: false, preserveDrawingBuffer: true });
  if (!gl) { document.body.insertAdjacentHTML('beforeend', '<p style="color:#f88;font:14px monospace;padding:20px">WebGL unavailable</p>'); return; }

  const vs = `
    attribute vec2 position;
    varying vec2 v_uv;
    void main(){ v_uv = position * 0.5 + 0.5; gl_Position = vec4(position, 0.0, 1.0); }
  `;

  // Fragment shader transcribed from oryzo.ai (AppleEfx.fragmentShader). Only
  // texture2D(u_texture, …) is replaced by sceneBase(), a stand-in for the frame.
  const fs = `
    precision highp float;
    varying vec2 v_uv;
    uniform vec2  u_resolution;
    uniform float u_time;
    uniform float u_amount;
    uniform float u_padding;
    uniform float u_pulse;
    uniform vec2  u_pulseCenter;
    uniform vec2  u_coverAspect;
    uniform vec3  u_c0;
    uniform vec3  u_c1;
    uniform vec3  u_c2;
    uniform vec3  u_c3;

    float linearstep(float edge0, float edge1, float x){ return clamp((x-edge0)/(edge1-edge0), 0., 1.); }
    float sdBox(in vec2 p, in vec2 b){ vec2 d = abs(p)-b; return length(max(d,0.0)) + min(max(d.x,d.y),0.0); }
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }

    // stand-in for the composited frame: a dark card of cream text on oryzo's
    // #4c3e37 warm ground, so the glow can be judged against real content.
    vec3 sceneBase(vec2 uv){
      float ar = u_resolution.x / u_resolution.y;
      vec2 p = (uv - 0.5) * vec2(ar, 1.0);
      float haze = smoothstep(1.15, -0.15, length(p - vec2(-0.75 * ar * 0.5, -0.55)));
      vec3 c = mix(vec3(0.008, 0.007, 0.0065), vec3(0.298, 0.243, 0.216), haze * 0.9);

      float d = sdBox(p, vec2(0.30 * ar * 0.5, 0.34)) - 0.02;
      float inCard = smoothstep(0.004, -0.004, d);
      c = mix(c, vec3(0.042, 0.035, 0.031), inCard);
      c += smoothstep(0.008, 0.0, abs(d)) * vec3(0.45, 0.20, 0.02);

      float bars = 0.0;
      for (int i = 0; i < 7; i++){
        float y = 0.26 - float(i) * 0.088;
        float hw = 0.22 * ar * 0.5 - mod(float(i), 3.0) * 0.045;
        bars += smoothstep(0.009, 0.003, abs(p.y - y)) * smoothstep(hw, hw - 0.02, abs(p.x));
      }
      c += bars * inCard * vec3(0.60, 0.50, 0.42);
      return c;
    }

    void main(){
      vec3 bnoise = vec3(hash(gl_FragCoord.xy), hash(gl_FragCoord.xy + 17.3), hash(gl_FragCoord.xy + 41.7));

      vec2 aspect = vec2(u_resolution.x/u_resolution.y, 1.0);
      vec2 glowUv = (v_uv - 0.5) * u_coverAspect * 2.0;
      float angle = u_time * -5.0;
      mat2 rot = mat2(cos(angle), -sin(angle), sin(angle), cos(angle));
      glowUv = rot * glowUv;
      glowUv = glowUv * 0.5 + 0.5;
      glowUv = clamp(glowUv, vec2(0.0), vec2(1.0));

      vec3 colorT = mix(u_c0, u_c1, glowUv.x);
      vec3 colorB = mix(u_c3, u_c2, glowUv.x);
      vec3 glowColor = mix(colorB, colorT, glowUv.y);
      glowColor *= glowColor * glowColor * 2.0;

      vec2 wp = (v_uv - u_pulseCenter) * aspect;
      float wl = length(aspect);
      float wpl = wl - length(wp);
      float wsl = 0.5 * wl;
      float wel = 0.5 * wl;
      float wtl = wl + wsl + wel;
      float wt = u_pulse * wtl - wl + wpl;
      float w0 = smoothstep(0.0, wsl, wt);
      float w1 = smoothstep(wsl + wel, wsl, wt);
      float wd = abs(wt - wsl);
      float wave = w0 * w1 * u_amount;

      vec2 waveDir = normalize(wp);
      vec2 borderUv = (v_uv - 0.5) * u_resolution + waveDir * wave * 0.01 * u_resolution.x;

      float d = sdBox(borderUv, u_resolution * 0.5 - u_padding * 2.0) - u_padding;
      d = linearstep(0.0, u_padding * 2.5, d);
      d = pow(d, 3.0);
      float d2 = sdBox(borderUv, u_resolution * 0.5 - u_padding * 3.0) - u_padding * 1.5;
      d2 = linearstep(0.0, u_padding * 5.5, d2);
      d2 = pow(d2, 5.0);

      vec4 base = vec4(sceneBase(v_uv + waveDir * smoothstep(0.0, 0.4, abs(wd)) * wave * -0.005), 1.0);
      vec3 color = pow(base.rgb, vec3(2.2));

      float glow = (0.001 + d + d2 * 0.5) * 5.0;
      color += u_amount * glowColor * glow;
      color += wave * (d * 0.25 + d2 * 0.25 + glowColor * 0.05);
      color = min(color, 1.0);

      glow = dot(glowColor, vec3(0.2126, 0.7152, 0.0722)) * glow;
      gl_FragColor = vec4(pow(color, vec3(1.0/2.2)) + bnoise * 0.004,
                          min(1.0, base.a + glow + wave * (d + d2 * 0.5 + 0.05)));
    }
  `;

  const compile = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(prog, 0, 'position');
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  for (const n of ['u_resolution','u_time','u_amount','u_padding','u_pulse','u_pulseCenter','u_coverAspect','u_c0','u_c1','u_c2','u_c3'])
    U[n] = gl.getUniformLocation(prog, n);

  const srgbToLinear = (c) => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  const lin = (hex) => [1, 3, 5].map(i => srgbToLinear(parseInt(hex.slice(i, i + 2), 16) / 255));
  const PALETTE = ['#ff9cff', '#ff9638', '#ffff22', '#54ffff'].map(lin);
  gl.uniform3fv(U.u_c0, PALETTE[0]);
  gl.uniform3fv(U.u_c1, PALETTE[1]);
  gl.uniform3fv(U.u_c2, PALETTE[2]);
  gl.uniform3fv(U.u_c3, PALETTE[3]);

  document.getElementById('sw').innerHTML =
    ['#ff9cff', '#ff9638', '#ffff22', '#54ffff'].map(h => `<i style="background:${h}"></i>`).join('');

  const $ = (id) => document.getElementById(id);
  const state = { amount: 1, spin: 1, pad: 50, pulse: 1, loop: true, pulseSpeed: 0.5, t: 0 };
  $('amount').oninput = e => { state.amount = +e.target.value; $('amountOut').value = state.amount.toFixed(2); };
  $('spin').oninput = e => { state.spin = +e.target.value; $('spinOut').value = '×' + state.spin.toFixed(2); };
  $('pad').oninput = e => { state.pad = +e.target.value; $('padOut').value = state.pad; };
  $('pulse').onclick = () => { state.pulse = 0; };
  $('loop').onchange = e => { state.loop = e.target.checked; };

  const resize = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
    if (cvs.width !== w || cvs.height !== h) { cvs.width = w; cvs.height = h; }
    gl.viewport(0, 0, w, h);
  };
  addEventListener('resize', resize);
  resize();

  const params = new URLSearchParams(location.search);
  if (params.has('a')) { state.amount = +params.get('a'); $('amount').value = state.amount; $('amountOut').value = state.amount.toFixed(2); }
  if (params.has('p')) { state.pulse = +params.get('p'); }

  let last = performance.now();
  let hold = 0;
  const draw = (now) => {
    const dt = Math.min((now - last) / 1000, 1 / 20); last = now;
    state.t += dt;

    state.pulse += dt * state.pulseSpeed;
    if (state.pulse >= 1) {
      state.pulse = 1;
      if (state.loop) { hold += dt; if (hold > 1.6) { hold = 0; state.pulse = 0; } }
    }

    const w = cvs.width, h = cvs.height;
    gl.uniform2f(U.u_resolution, w, h);
    gl.uniform1f(U.u_time, state.t * state.spin);
    gl.uniform1f(U.u_amount, state.amount);
    gl.uniform1f(U.u_padding, Math.min(state.pad, Math.min(innerWidth, innerHeight) * 0.1));
    gl.uniform1f(U.u_pulse, state.pulse);
    gl.uniform2f(U.u_pulseCenter, 1.001, 0.5);
    const i = Math.min(h / w, 1) / Math.sqrt(w * w + h * h) * Math.max(w, h);
    gl.uniform2f(U.u_coverAspect, w / h * i, i);

    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
